[project]
name = "memoryfield-tool"
dynamic = ["version"]
description = "CLI tool for reading, writing and exporting memoryfields"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [{ name = "Cal Paterson", email = "cal@calpaterson.com" }]
readme = "README.md"
dependencies = [
    "boto3>=1.35,<2",
    "click~=8.3.0",
    "flask~=3.1",
    "markdown~=3.7",
    "ollama~=0.6",
    "pysqlite3-binary~=0.5",
    "pyyaml~=6.0.3",
    "sqlite-vec~=0.1.9",
    "tomli-w~=1.0",
    "tqdm~=4.67",
    "uuid6>=1.0; python_version < '3.14'",
    "waitress~=3.0",
]

[project.scripts]
memoryfield-tool = "memoryfield_tool.cli:main"

[project.urls]
Homepage = "https://github.com/calpaterson/memoryfield-tool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "code"
path = "version.py"
expression = "derive_version()"

[tool.hatch.build.targets.wheel]
packages = ["src/memoryfield_tool"]
force-include = { "src/memoryfield_tool/static" = "memoryfield_tool/static" }

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
exclude = ["src/memoryfield_tool/static"]

[dependency-groups]
dev = [
    "moto>=5.0",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
ignore_missing_imports = true
